# lightning.pytorch==2.5.2
seed_everything: 42
trainer:
  accelerator: gpu
  strategy: auto
  devices: 1
  num_nodes: 1
  precision: 16-mixed
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      offline_directory: /share/rcif2/pduckett/hepattn-dq/logs/
      log_env_details: true
      api_key: null
      workspace: null
      project: trackml_filtering
      experiment_key: null
      mode: null
      online: null
      prefix: null
  callbacks:
  - class_path: hepattn.callbacks.Compile
    init_args:
      dynamic: true
      mode: null
      skip_dynamic_cudagraphs: false
  - class_path: hepattn.callbacks.InferenceTimer
  - class_path: hepattn.callbacks.SaveConfig
  - class_path: hepattn.callbacks.Checkpoint
    init_args:
      monitor: val/loss
      log_model: true
      dirpath: null
      verbose: false
      save_last: null
      save_weights_only: false
      mode: min
      every_n_train_steps: null
      train_time_interval: null
      every_n_epochs: null
      save_on_train_epoch_end: null
      enable_version_counter: true
  - class_path: hepattn.callbacks.PredictionWriter
    init_args:
      write_inputs: false
      write_outputs: false
      write_preds: true
      write_targets: true
      write_losses: false
      write_layers: null
  - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    init_args:
      logging_interval: null
      log_momentum: false
      log_weight_decay: false
  - class_path: lightning.pytorch.callbacks.TQDMProgressBar
    init_args:
      refresh_rate: 100
      process_position: 0
      leave: false
  fast_dev_run: false
  max_epochs: 100
  min_epochs: null
  max_steps: -1
  min_steps: null
  max_time: null
  limit_train_batches: null
  limit_val_batches: null
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: null
  check_val_every_n_epoch: 1
  num_sanity_val_steps: null
  log_every_n_steps: 100
  enable_checkpointing: null
  enable_progress_bar: true
  enable_model_summary: null
  accumulate_grad_batches: 1
  gradient_clip_val: 0.1
  gradient_clip_algorithm: null
  deterministic: null
  benchmark: null
  inference_mode: true
  use_distributed_sampler: true
  profiler: null
  detect_anomaly: false
  barebones: false
  plugins: null
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: /share/rcif2/pduckett/hepattn-dq/HF-pix-600MeV-eta4_20260214-T195401
  model_registry: null
model:
  model:
    class_path: hepattn.models.HitFilter
    init_args:
      input_nets:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
          - class_path: hepattn.models.InputNet
            init_args:
              input_name: hit
              net:
                class_path: hepattn.models.Dense
                init_args:
                  input_size: 16
                  output_size: 256
                  hidden_layers:
                  - 128
                  hidden_dim_scale: 2
                  activation: null
                  final_activation: null
                  dropout: 0.0
                  bias: true
              fields:
              - x
              - y
              - z
              - r
              - eta
              - phi
              - u
              - v
              - charge_frac
              - leta
              - lphi
              - lx
              - ly
              - lz
              - geta
              - gphi
              posenc: null
              input_dtype: null
      encoder:
        class_path: hepattn.models.Encoder
        init_args:
          num_layers: 8
          dim: 256
          attn_type: flash
          window_size: 1024
          window_wrap: true
          score_mod: null
          value_residual: false
          num_register_tokens: null
          attn_kwargs: null
          norm: RMSNorm
          layer_scale: null
          drop_path: 0.0
          qkv_norm: false
          hybrid_norm: true
          dense_kwargs: null
      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
          - class_path: hepattn.models.task.HitFilterTask
            init_args:
              name: hit_filter
              input_object: hit
              target_field: on_valid_particle
              dim: 256
              threshold: 0.1
              mask_keys: false
              loss_fn: bce
              has_intermediate_loss: true
      input_sort_field: phi
  lrs_config:
    initial: 1.0e-05
    max: 5.0e-05
    end: 1.0e-06
    pct_start: 0.05
    weight_decay: 1.0e-05
  optimizer: Lion
data:
  train_dir:  /share/rcif2/pduckett/data/prepped/train/
  val_dir: /share/rcif2/pduckett/data/prepped/val/
  test_dir: /share/rcif2/pduckett/data/prepped/test/
  num_workers: 12
  num_train: -1
  num_val: -1
  num_test: -1
  pin_memory: true
  hit_eval_train: null
  hit_eval_val: null
  hit_eval_test: null
  inputs:
    hit:
    - x
    - y
    - z
    - r
    - s
    - eta
    - phi
    - u
    - v
    - charge_frac
    - leta
    - lphi
    - lx
    - ly
    - lz
    - geta
    - gphi
  targets:
    hit:
    - on_valid_particle
    - is_first
    particle:
    - pt
  hit_volume_ids:
  - 7
  - 8
  - 9
  feature_volume_ids: null
  particle_min_pt: 0.6
  particle_max_abs_eta: 4.0
  particle_min_num_hits: 3
  event_max_num_particles: 3000
  strict_max_objects: false
  hit_filter_threshold: 0.1
  dummy_data: false
name: HF-pix-600MeV-eta4
matmul_precision: high
optimizer: null
lr_scheduler: null
ckpt_path: null
