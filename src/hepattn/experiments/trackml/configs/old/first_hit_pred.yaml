seed_everything: 42
name: first-hit-pred

data:
  #train_dir: data/trackml/prepped/
  #val_dir: data/trackml/prepped/
  #test_dir: data/trackml/prepped/
  train_dir:  /share/rcif2/pduckett/data/prepped/train/
  val_dir: /share/rcif2/pduckett/data/prepped/val/
  test_dir: /share/rcif2/pduckett/data/prepped/test/

  hit_eval_train: /share/rcif2/pduckett/hepattn-dq/HF-pix-600MeV-eta4_20260214-T195401/epoch=070-val_loss=0.20153_train_eval.h5
  hit_eval_val: /share/rcif2/pduckett/hepattn-dq/HF-pix-600MeV-eta4_20260214-T195401/epoch=070-val_loss=0.20153_val_eval.h5
  hit_eval_test: /share/rcif2/pduckett/hepattn-dq/HF-pix-600MeV-eta4_20260214-T195401/epoch=070-val_loss=0.20153_test_eval.h5
  hit_filter_threshold: 0.1

  num_workers: 15
  num_train: -1
  num_test: -1
  num_val: -1

  # Select only hits from these detector volumes
  # pix barrel: 8, pix endcap: 7, 9
  # See: https://competitions.codalab.org/competitions/20112
  hit_volume_ids: [7, 8, 9]

  # Minimum pt for a particle to be deemed reconstructible
  particle_min_pt: 0.6

  # Maximum absolute eta for a particle to be deemed reconstructible
  particle_max_abs_eta: 4.0

  # Minimum number of true hits for a particle to be deemed reconstructible
  particle_min_num_hits: 3

  # Maximum number of reconstructable particles allowed in an event (not relevant for filtering)
  event_max_num_particles: 3000
  strict_max_objects: false

  # Define which inputs will be available to the model
  inputs:
    hit:
      # Global hit coords
      - x
      - y
      - z
      - r
      - s
      - eta
      - phi
      - u
      - v
      # Hit local charge information
      - charge_frac
      - leta
      - lphi
      - lx
      - ly
      - lz
      - geta
      - gphi

  targets:
    hit:
      - on_valid_particle
      - is_first
    particle:
      - pt

trainer:
  max_epochs: 10
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  log_every_n_steps: 100
  default_root_dir: logs
  gradient_clip_val: 0.1
  enable_progress_bar: True

  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      project: trackml_filtering

  callbacks:
    - class_path: hepattn.callbacks.Compile
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/loss
    - class_path: hepattn.callbacks.PredictionWriter
      init_args:
        write_inputs: true
        write_outputs: false
        write_preds: true
        write_targets: true
        write_losses: false
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 100

model:
  optimizer: Lion
  topk_query_limits: [600, 1200, 2200]
  topk_policy: eta_r_topk
  topk_eta_bins: 10
  topk_r_bins: 8

  lrs_config:
    initial: 1e-5
    max: 5e-5
    end: 1e-6
    pct_start: 0.05
    weight_decay: 1e-5

  model:
    class_path: hepattn.models.HitFilter
    init_args:
      input_sort_field: phi
      input_nets:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.InputNet
              init_args:
                input_name: hit
                fields:
                  - x
                  - y
                  - z
                  - r
                  - eta
                  - phi
                  - u
                  - v
                  - s
                  - charge_frac
                  - leta
                  - lphi
                  - lx
                  - ly
                  - lz
                  - geta
                  - gphi
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: 17
                    hidden_layers: [128]
                    output_size: &dim 128
                    activation: SwiGLU
                posenc:
                  class_path: hepattn.models.PositionEncoder
                  init_args:
                    input_name: hit
                    fields:
                      - r
                      - eta
                      - phi
                    dim: *dim
      encoder:
        class_path: hepattn.models.Encoder
        init_args:
          num_layers: 8
          dim: *dim
          attn_type: flash
          window_size: 512
          window_wrap: true
          hybrid_norm: true
          norm: CustomLayerNorm
          dense_kwargs: {activation: SwiGLU}
          attn_kwargs: {bias: false}

      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.task.ClassificationTask
              init_args:
                name: query_init
                input_object: hit
                classes: ["is_first"]
                loss_weight: 1.0
                threshold: 0.05
                permute_loss: false
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: *dim
                    hidden_layers: [256]
                    output_size: 1
