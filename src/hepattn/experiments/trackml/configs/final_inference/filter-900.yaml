seed_everything: 42
name: HF-pix-900MeV-eta4
matmul_precision: high

data:
  train_dir: /share/rcif2/pduckett/data/prepped/train/
  val_dir: /share/rcif2/pduckett/data/prepped/val/
  test_dir: /share/rcif2/pduckett/data/prepped/test/

  num_workers: 12
  num_train: -1
  num_val: -1
  num_test: -1
  pin_memory: true

  # Select only hits from these detector volumes.
  # pix barrel: 8, pix endcap: 7, 9
  hit_volume_ids: [7, 8, 9]

  # Minimum pt for a particle to be deemed reconstructible.
  particle_min_pt: 0.9

  # Maximum absolute eta for a particle to be deemed reconstructible.
  particle_max_abs_eta: 4.0

  # Minimum number of true hits for a particle to be deemed reconstructible.
  particle_min_num_hits: 3

  # Maximum number of reconstructable particles allowed in an event.
  event_max_num_particles: 3000
  strict_max_objects: false

  inputs:
    hit:
      - x
      - y
      - z
      - r
      - s
      - eta
      - phi
      - u
      - v
      - charge_frac
      - leta
      - lphi
      - lx
      - ly
      - lz
      - geta
      - gphi

  targets:
    hit:
      - on_valid_particle
      - is_first
    particle:
      - pt

trainer:
  max_epochs: 100
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  log_every_n_steps: 100
  default_root_dir: /share/rcif2/pduckett/hepattn-dq/HF-pix-600MeV-eta4_20260214-T195401
  gradient_clip_val: 0.1
  enable_progress_bar: true

  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      offline_directory: /share/rcif2/pduckett/hepattn-dq/logs/
      project: trackml_filtering

  callbacks:
    - class_path: hepattn.callbacks.Compile
      init_args:
        dynamic: true
    - class_path: hepattn.callbacks.InferenceTimer
      init_args:
        repeats_per_batch: 20
        warmup_repeats_per_batch: 50
        warmup_full_test_set_passes: 1
        summary_stat: median
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/loss
    - class_path: hepattn.callbacks.PredictionWriter
      init_args:
        write_inputs: false
        write_outputs: false
        write_preds: true
        write_targets: true
        write_losses: false
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 100
        leave: false

model:
  optimizer: Lion

  lrs_config:
    initial: 1e-5
    max: 5e-5
    end: 1e-6
    pct_start: 0.05
    weight_decay: 1e-5

  model:
    class_path: hepattn.models.HitFilter
    init_args:
      input_sort_field: phi
      input_nets:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.InputNet
              init_args:
                input_name: hit
                fields:
                  - x
                  - y
                  - z
                  - r
                  - eta
                  - phi
                  - u
                  - v
                  - charge_frac
                  - leta
                  - lphi
                  - lx
                  - ly
                  - lz
                  - geta
                  - gphi
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: 16
                    hidden_layers: [128]
                    output_size: &dim 256

      encoder:
        class_path: hepattn.models.Encoder
        init_args:
          num_layers: 8
          dim: *dim
          attn_type: flash
          window_size: 1024
          window_wrap: true
          hybrid_norm: true
          norm: RMSNorm

      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.task.HitFilterTask
              init_args:
                name: hit_filter
                input_object: hit
                target_field: on_valid_particle
                dim: *dim
                threshold: 0.1
                loss_fn: bce
